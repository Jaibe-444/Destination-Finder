<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DestinationFinder | Find Your Next Holiday Destination</title>

    <!-- Google Fonts: Montserrat (Headings) & Open Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- 1. Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-compass-fill text-warning me-2"></i>DestinationFinder
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#explore">Explore</a></li>
                    <li class="nav-item"><a class="nav-link" href="#packages">Packages</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- 2. Hero Header & Search Form -->
    <header class="hero-section text-white text-center py-5">
        <div class="container py-4">
            <h1 class="display-4 fw-bold">Find Your Next Holiday Destination</h1>
            <p class="lead mb-4">Discover top attractions, accommodations, and dining across the globe.</p>
            
            <form id="search-form" class="row g-2 justify-content-center bg-white p-3 rounded-4 shadow max-w-700 mx-auto">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0"><i class="bi bi-geo-alt-fill text-danger"></i></span>
                        <input type="text" id="destination-input" class="form-control border-0" placeholder="Enter a city (e.g. London, Paris)">
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="category-select" class="form-select border-0">
                        <option value="all" selected>All Categories</option>
                        <option value="attractions">Attractions</option>
                        <option value="lodging">Accommodations</option>
                        <option value="restaurants">Restaurants</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Search</button>
                </div>
            </form>
        </div>
    </header>
</body>
</html>
